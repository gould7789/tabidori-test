# 서비스 3개: 웹 서버 · 워커 · DB (11교시~)
#
#   docker compose up -d db           DB만 (웹 서버·워커를 맥에서 직접 띄울 때 — 9·10·11교시 실습)
#   docker compose up --build         세 개 전부 컨테이너로 (코드를 고쳤으면 --build로 이미지 다시 만들기)
#   docker compose up --build --scale worker=2    워커 2개
#   docker compose ps                 상태 확인
#   docker compose logs -f worker     워커 로그 보기
#   docker compose down               중지 (데이터는 볼륨에 남음) / down -v 는 데이터까지 삭제
services:
  db:
    image: postgres:18          # 최신 안정판(18.x). AWS RDS도 18 지원(2025-11~)
    environment:
      # 로컬 개발 전용 계정. 외부에 공개하는 서버에선 이런 고정 비밀번호를 쓰지 않는다.
      POSTGRES_USER: tabidori
      POSTGRES_PASSWORD: tabidori
      POSTGRES_DB: tabidori
    ports:
      - "5433:5432"            # 맥의 5433번 포트 → 컨테이너의 5432번 포트 (맥에 이미 있는 PostgreSQL이 5432를 쓰고 있어서)
    volumes:
      - pgdata18:/var/lib/postgresql      # 컨테이너를 지워도 데이터가 남는 저장 공간 (18부터 경로가 /var/lib/postgresql로 바뀜)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabidori"]
      interval: 2s
      retries: 15

  web:                          # 웹 서버: 요청 처리 · 화면 · 채팅 그래프
    build: .
    command: uvicorn lesson11:app --host 0.0.0.0 --port 8000    # 컨테이너 밖(맥 브라우저)에서 들어오려면 0.0.0.0
    environment:
      DATABASE_URL: postgresql://tabidori:tabidori@db:5432/tabidori   # 컨테이너끼리는 서비스 이름(db)과 안쪽 포트(5432)로
      FAKE_DELAY: ${FAKE_DELAY:-0.5}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:                       # 워커: 작업표에서 일을 꺼내 Loop A 실행. 요청을 받지 않으니 ports 없음
    build: .
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://tabidori:tabidori@db:5432/tabidori
      LOOPA_SECONDS: ${LOOPA_SECONDS:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_STALE: ${WORKER_STALE:-60}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata18:
